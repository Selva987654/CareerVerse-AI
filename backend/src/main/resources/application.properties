server.port=8081

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerverse_ai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=false

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT secret must be 32+ characters. Change in production.
app.jwt-secret=${JWT_SECRET:local-development-only-change-this-secret-32-chars}

# Demo data seed. Keep true for viva/demo. Set false in production.
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Gemini AI API. Keep only in backend. Set GEMINI_API_KEY in your terminal for live AI.
gemini.api.key=${GEMINI_API_KEY:dummy}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# Google OAuth. Dummy values let database demo login run; replace for real Google login.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
